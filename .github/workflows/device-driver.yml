# Verifies that src/device.rs stays in sync with the code generated from INA4230.ddsl.
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: device-driver-pregen-check
jobs:
  device-driver-pregen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check generated device driver
        uses: tullom/device-driver-pregen-check@v1.2.0
        with:
          source: INA4230.ddsl
          generated-file: src/device.rs
          cli-version: '2.1.0'
          rust-toolchain: '1.94.0'
          rust-defmt-feature: defmt
